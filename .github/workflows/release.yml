      #       -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
      #       -d "{\"event_type\":\"keel-release\",\"client_payload\":{\"version\":\"$VERSION\",\"tag\":\"$GITHUB_REF_NAME\",\"releaseJsonUrl\":\"https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_REF_NAME/release.json\"}}"
