name: Release feed

# Keeps release.json / RELEASE.md in step with CHANGELOG.md and every version stamp.
# On a keel--v* tag it also checks the tag matches the CHANGELOG version and (once enabled)
# triggers the TLA site deploy with workflow_dispatch.
on:
  push:
    branches: [main]
    tags: ['keel--v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags are needed for compareUrl
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generator self-test
        run: node scripts/release.mjs --self-test
      - name: release.json, RELEASE.md and version stamps agree with CHANGELOG (and the tag)
        run: node scripts/release.mjs --check

